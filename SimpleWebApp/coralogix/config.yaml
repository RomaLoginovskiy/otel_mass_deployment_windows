      - delete_key(resource.attributes, "process.executable.path")
      - delete_key(resource.attributes, "process.owner")
      - delete_key(resource.attributes, "process.pid")
      - delete_key(resource.attributes, "process.parent_pid")
      - delete_key(resource.attributes, "process.runtime.description")
      - delete_key(resource.attributes, "process.runtime.name")
      - delete_key(resource.attributes, "process.runtime.version")
  transform/semconv:
    error_mode: ignore
    trace_statements:
    - context: span
      statements:
      - set(span.attributes["http.method"], span.attributes["http.request.method"]) where span.attributes["http.request.method"] != nil
  transform/spanmetrics:
    error_mode: silent
    metric_statements:
    - context: datapoint
      statements:
      - set(datapoint.attributes["status.code"], "STATUS_CODE_ERROR") where datapoint.attributes["status.code"] == nil and instrumentation_scope.name == "spanmetricsconnector" and datapoint.attributes["otel.status_code"] == "ERROR"
      - set(datapoint.attributes["status.code"], "STATUS_CODE_OK") where datapoint.attributes["status.code"] == nil and instrumentation_scope.name == "spanmetricsconnector" and datapoint.attributes["otel.status_code"] == "OK"
      - set(datapoint.attributes["status.code"], "STATUS_CODE_UNSET") where datapoint.attributes["status.code"] == nil and instrumentation_scope.name == "spanmetricsconnector" and (datapoint.attributes["otel.status_code"] == "UNSET" or datapoint.attributes["otel.status_code"] == nil)

receivers:
  filelog/iis:
    header:
      metadata_operators:
      - if: body matches "^#Fields:"
        parse_from: body
        regex: ^#Fields:\s+(?P<csv_header>.+)$
        type: regex_parser
      pattern: ^#.*$
    include:
    - C:\inetpub\logs\LogFiles\W3SVC*\*.log
    include_file_name: true
    include_file_path: false
    operators:
    - delimiter: ' '
      header_attribute: csv_header
      id: iis_csv_parser
      if: body != nil and body not matches "^#"
      trim_space: true
      type: csv_parser
    start_at: beginning
    storage: file_storage
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk: null
      filesystem:
        exclude_mount_points:
          match_type: strict
          mount_points:
          - ""
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network: null
      paging: null
      process:
        metrics:
          process.cpu.utilization:
            enabled: true
          process.memory.utilization:
            enabled: true
          process.threads:
            enabled: true
        mute_process_all_errors: true
  iis:
    collection_interval: 30s
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_LISTEN_INTERFACE:-127.0.0.1}:4317
        max_recv_msg_size_mib: 20
      http:
        endpoint: ${env:OTEL_LISTEN_INTERFACE:-127.0.0.1}:4318
  prometheus:
    config:
      scrape_configs:
      - job_name: opentelemetry-collector
        scrape_interval: '30s'
        static_configs:
        - targets:
          - ${env:OTEL_LISTEN_INTERFACE:-127.0.0.1}:8888
  windowseventlog/application:
    channel: Application
  windowseventlog/security:
    channel: Security
  windowseventlog/system:
    channel: System

service:
  extensions:
  - health_check
  - opamp
  - file_storage
  - zpages
  - pprof
  pipelines:
    logs:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - resourcedetection/region
      - resourcedetection/env
      - resource/metadata
      - resource/service
      - transform/reduce
      - transform/iis
      - batch
      receivers:
      - windowseventlog/system
      - windowseventlog/application
      - windowseventlog/security
      - filelog/iis
      - otlp
    logs/resource_catalog:
      exporters:
      - coralogix/resource_catalog
      processors:
      - memory_limiter
      - resource/metadata
      - resource/service
      - resourcedetection/entity
      - resourcedetection/region
      - transform/entity-event
      receivers:
      - hostmetrics
    metrics:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - resourcedetection/region
      - resourcedetection/env
      - resource/metadata
      - resource/service
      - transform/spanmetrics
      - transform/reduce
      - transform/prometheus
      - batch
      receivers:
      - hostmetrics
      - spanmetrics
      - spanmetrics/db
      - prometheus
      - iis
      - otlp
    metrics/compact:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - transform/spanmetrics
      - batch
      receivers:
      - spanmetrics/compact
    metrics/db_compact:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - transform/spanmetrics
      - batch
      receivers:
      - spanmetrics/db_compact
    traces:
      exporters:
      - spanmetrics
      - forward/db
      - forward/compact
      - forward/db_compact
      - coralogix
      processors:
      - memory_limiter
      - resourcedetection/region
      - resourcedetection/env
      - resource/metadata
      - resource/service
      - transform/spanmetrics
      - redaction/spanname
      - transform/reduce
      - transform/semconv
      - transform/db_semconv
      - groupbytrace/transactions
      - coralogix
      - batch
      receivers:
      - otlp
    traces/compact:
      exporters:
      - spanmetrics/compact
      processors:
      - transform/compact
      - batch
      receivers:
      - forward/compact
    traces/db:
      exporters:
      - spanmetrics/db
      processors:
      - filter/db_spanmetrics
      - batch
      receivers:
      - forward/db
    traces/db_compact:
      exporters:
      - spanmetrics/db_compact
      processors:
      - filter/db_compact_spanmetrics
      - transform/db_compact
      - batch
      receivers:
      - forward/db_compact
  telemetry:
    logs:
      encoding: json
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: ${env:OTEL_LISTEN_INTERFACE:-127.0.0.1}
              port: 8888
              without_scope_info: false
              without_type_suffix: false
              without_units: false
