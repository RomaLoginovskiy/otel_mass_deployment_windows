# Coralogix Windows standalone collector config (helm-otel-standalone/0.0.42 shape).
# Verbatim from the user's canonical config, with ONE fix: coralogix/resource_catalog
# private_key ${CORALOGIX_PRIVATE_KEY} -> ${env:CORALOGIX_PRIVATE_KEY} (bare ${VAR} is
# removed in current collectors; matches the main coralogix exporter). Span metrics are
# generated by the spanmetrics/spanmetrics.compact/spanmetrics.db/spanmetrics.db_compact
# connectors and shipped to Coralogix via the metrics/metrics.compact/metrics.db_compact
# pipelines.

connectors:
  forward/compact: {}
  forward/db: {}
  forward/db_compact: {}
  spanmetrics:
    add_resource_attributes: true
    aggregation_cardinality_limit: 100000
    dimensions:
    - name: http.method
    - name: cgx.transaction
    - name: cgx.transaction.root
    - name: status_code
    - name: db.namespace
    - name: db.operation.name
    - name: db.collection.name
    - name: db.system
    - name: http.response.status_code
    - name: rpc.grpc.status_code
    - name: service.version
    exclude_dimensions:
    - collector.instance.id
    histogram:
      explicit:
        buckets:
        - 1ms
        - 4ms
        - 10ms
        - 20ms
        - 50ms
        - 100ms
        - 200ms
        - 500ms
        - 1s
        - 2s
        - 5s
      unit: ms
    metrics_expiration: 5m
    metrics_flush_interval: '30s'
    namespace: ""
  spanmetrics/compact:
    add_resource_attributes: true
    aggregation_cardinality_limit: 100000
    exclude_dimensions:
    - collector.instance.id
    - span.name
    histogram:
      explicit:
        buckets:
        - 1ms
        - 4ms
        - 10ms
        - 20ms
        - 50ms
        - 100ms
        - 200ms
        - 500ms
        - 1s
        - 2s
        - 5s
      unit: ms
    metrics_expiration: 5m
    metrics_flush_interval: '30s'
    namespace: compact
  spanmetrics/db:
    add_resource_attributes: true
    aggregation_cardinality_limit: 100000
    dimensions:
    - name: db.namespace
    - name: db.operation.name
    - name: db.collection.name
    - name: db.system
    - name: service.version
    exclude_dimensions:
    - collector.instance.id
    histogram:
      explicit:
        buckets:
        - 1ms
        - 4ms
        - 10ms
        - 20ms
        - 50ms
        - 100ms
        - 200ms
        - 500ms
        - 1s
        - 2s
        - 5s
      unit: ms
    metrics_expiration: 5m
    metrics_flush_interval: '30s'
    namespace: db
  spanmetrics/db_compact:
    add_resource_attributes: true
    aggregation_cardinality_limit: 100000
    dimensions:
    - name: db.namespace
    - name: db.system
    exclude_dimensions:
    - collector.instance.id
    - span.name
    - span.kind
    histogram:
      explicit:
        buckets:
        - 1ms
        - 4ms
        - 10ms
        - 20ms
        - 50ms
        - 100ms
        - 200ms
        - 500ms
        - 1s
        - 2s
        - 5s
      unit: ms
    metrics_expiration: 5m
    metrics_flush_interval: '30s'
    namespace: db_compact

exporters:
  coralogix:
    application_name: otel
    application_name_attributes:
    - cx.application.name
    - service.namespace
    domain: eu1.coralogix.com
    domain_settings:
      keepalive:
        enabled: true
        permit_without_stream: false
        time: 30s
        timeout: 10s
    logs:
      headers:
        X-Coralogix-Distribution: helm-otel-standalone/0.0.42
    metrics:
      headers:
        X-Coralogix-Distribution: helm-otel-standalone/0.0.42
    private_key: ${env:CORALOGIX_PRIVATE_KEY}
    profiles:
      headers:
        X-Coralogix-Distribution: helm-otel-standalone/0.0.42
        x-coralogix-ingress: otlp/v1.10.0
    sending_queue:
      batch:
        flush_timeout: 250ms
        max_size: 2097152
        min_size: 1048576
        sizer: bytes
      enabled: true
      num_consumers: 20
      queue_size: 209715200
      sizer: bytes
    subsystem_name: windows
    subsystem_name_attributes:
    - cx.subsystem.name
    - service.name
    timeout: 30s
    traces:
      headers:
        X-Coralogix-Distribution: helm-otel-standalone/0.0.42
  coralogix/resource_catalog:
    application_name: resource
    domain: eu1.coralogix.com
    logs:
      headers:
        X-Coralogix-Distribution: helm-otel-standalone/0.0.42
        x-coralogix-ingress: metadata-as-otlp-logs/v1
    private_key: ${env:CORALOGIX_PRIVATE_KEY}
    sending_queue:
      batch:
        flush_timeout: 250ms
        max_size: 2097152
        min_size: 1048576
        sizer: bytes
      enabled: true
      num_consumers: 20
      queue_size: 209715200
      sizer: bytes
    subsystem_name: catalog
    timeout: 30s
  debug: {}

extensions:
  file_storage:
    create_directory: true
    directory: C:\ProgramData\OpenTelemetry\Collector\storage
  health_check:
    endpoint: ${env:OTEL_LISTEN_INTERFACE:-127.0.0.1}:13133
  opamp:
    agent_description:
      include_resource_attributes: true
      non_identifying_attributes:
        cx.agent.type: agent
        helm.chart.opentelemetry-agent.version: 0.134.3
    server:
      http:
        endpoint: https://ingress.eu1.coralogix.com/opamp/v1
        headers:
          Authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY}
        polling_interval: 2m
  pprof:
    endpoint: localhost:1777
  zpages:
    endpoint: localhost:55679

processors:
  batch:
    send_batch_max_size: 2048
    send_batch_size: 1024
    timeout: 1s
  coralogix:
    transactions:
      enabled: true
  filter/db_compact_spanmetrics:
    traces:
      span:
      - span.kind != SPAN_KIND_CLIENT or span.attributes["db.namespace"] == nil or span.attributes["db.system"] == nil
  filter/db_spanmetrics:
    traces:
      span:
      - span.attributes["db.system"] == nil
  groupbytrace/transactions:
    wait_duration: 30s
  memory_limiter:
    check_interval: 5s
    limit_mib: ${env:OTEL_MEMORY_LIMIT_MIB:-1024}
  redaction/spanname:
    allow_all_keys: true
    db_sanitizer: null
    url_sanitizer:
      enabled: true
  resource/metadata:
    attributes:
    - action: upsert
      key: cx.otel_integration.name
      value: coralogix-windows-standalone
    # Non-k8s host has no k8s.cluster.name source; set it so the compact/db_compact
    # span-metrics keep_keys (and base/db) carry it. Static for now.
    - action: upsert
      key: k8s.cluster.name
      value: windows-iis
  # service.name: links host/infra signals (hostmetrics, iis receiver, windows event
  # logs, IIS access logs) that arrive without one to the app's service; insert = only
  # when absent, so app telemetry (OTEL_SERVICE_NAME=SimpleWebApp) and collector
  # self-metrics (service.name=opentelemetry-collector) keep theirs.
  # service.namespace: absent everywhere, so insert unifies ALL signals under one
  # Coralogix application (exporter maps service.namespace -> application name).
  resource/service:
    attributes:
    - action: insert
      key: service.name
      value: SimpleWebApp
    - action: insert
      key: service.namespace
      value: iis-instrumentation-test
  resourcedetection/entity:
    detectors:
    - system
    - env
    override: false
    system:
      resource_attributes:
        host.cpu.cache.l2.size:
          enabled: true
        host.cpu.family:
          enabled: true
        host.cpu.model.id:
          enabled: true
        host.cpu.model.name:
          enabled: true
        host.cpu.stepping:
          enabled: true
        host.cpu.vendor.id:
          enabled: true
        host.id:
          enabled: true
        host.ip:
          enabled: true
        host.mac:
          enabled: true
        os.description:
          enabled: true
    timeout: 2s
  resourcedetection/env:
    detectors:
    - system
    - env
    override: false
    system:
      resource_attributes:
        host.id:
          enabled: true
    timeout: 2s
  resourcedetection/region:
    detectors:
    - gcp
    - ec2
    - azure
    override: true
    timeout: 2s
  transform/compact:
    trace_statements:
    - context: resource
      statements:
      - keep_keys(resource.attributes, ["service.name", "k8s.cluster.name", "host.name", "deployment.environment.name"])
  transform/db_compact:
    trace_statements:
    - context: resource
      statements:
      - keep_keys(resource.attributes, ["service.name", "k8s.cluster.name", "host.name", "deployment.environment.name"])
    - context: span
      statements:
      - keep_keys(span.attributes, ["db.namespace", "db.system"])
  # Bridge new DB semconv -> the attribute names the db/db_compact filters and
  # spanmetrics dimensions key on. .NET auto-instrumentation emits db.system.name
  # (new semconv); filter/db_spanmetrics keys on db.system, so without this the db
  # span metrics get 0 spans. Runs in the main traces pipeline before forward/db.
  transform/db_semconv:
    error_mode: ignore
    trace_statements:
    - context: span
      statements:
      - set(span.attributes["db.system"], span.attributes["db.system.name"]) where span.attributes["db.system"] == nil and span.attributes["db.system.name"] != nil
      - set(span.attributes["db.namespace"], span.attributes["db.name"]) where span.attributes["db.namespace"] == nil and span.attributes["db.name"] != nil
      - set(span.attributes["db.operation.name"], span.attributes["db.operation"]) where span.attributes["db.operation.name"] == nil and span.attributes["db.operation"] != nil
      - set(span.attributes["db.collection.name"], span.attributes["db.sql.table"]) where span.attributes["db.collection.name"] == nil and span.attributes["db.sql.table"] != nil
  transform/entity-event:
    error_mode: silent
    log_statements:
    - context: log
      statements:
      - set(log.attributes["otel.entity.id"]["host.id"], resource.attributes["host.id"])
      - merge_maps(log.attributes, resource.attributes, "insert")
    - context: resource
      statements:
      - keep_keys(resource.attributes, [""])
  transform/iis:
    error_mode: ignore
    log_statements:
    - context: log
      statements:
      - set(log.attributes["client.address"], log.attributes["c-ip"]) where log.attributes["c-ip"] != nil
      - set(log.attributes["http.request.method"], log.attributes["cs-method"]) where log.attributes["cs-method"] != nil
      - set(log.attributes["http.response.status_code"], log.attributes["sc-status"]) where log.attributes["sc-status"] != nil
      - set(log.attributes["user_agent.original"], log.attributes["cs(User-Agent)"]) where log.attributes["cs(User-Agent)"] != nil
      - set(log.attributes["url.path"], log.attributes["cs-uri-stem"]) where log.attributes["cs-uri-stem"] != nil
      - set(log.attributes["url.query"], log.attributes["cs-uri-query"]) where log.attributes["cs-uri-query"] != nil
      - set(log.attributes["http.request.header.referer"], [log.attributes["cs(Referer)"]]) where log.attributes["cs(Referer)"] != nil
      - set(log.attributes["http.server.request.duration_ms"], Int(log.attributes["time-taken"])) where log.attributes["time-taken"] != nil
      - delete_key(log.attributes, "c-ip")
      - delete_key(log.attributes, "cs-method")
      - delete_key(log.attributes, "sc-status")
      - delete_key(log.attributes, "cs(User-Agent)")
      - delete_key(log.attributes, "cs-uri-stem")
      - delete_key(log.attributes, "cs-uri-query")
      - delete_key(log.attributes, "cs(Referer)")
      - delete_key(log.attributes, "time-taken")
      - delete_key(log.attributes, "sc-win32-status")
      - delete_key(log.attributes, "s-port")
  transform/prometheus:
    error_mode: ignore
    metric_statements:
    - context: metric
      statements:
      - replace_pattern(metric.name, "_total$", "") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_process_cpu_seconds_seconds$", "otelcol_process_cpu_seconds") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_process_runtime_heap_alloc_bytes_bytes$", "otelcol_process_runtime_heap_alloc_bytes") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_process_runtime_total_alloc_bytes_bytes$", "otelcol_process_runtime_total_alloc_bytes") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_process_runtime_total_sys_memory_bytes_bytes$", "otelcol_process_runtime_total_sys_memory_bytes") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_fileconsumer_open_files$", "otelcol_fileconsumer_open_files_ratio") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_fileconsumer_reading_files$", "otelcol_fileconsumer_reading_files_ratio") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_ip_lookup_miss$", "otelcol_otelsvc_k8s_ip_lookup_miss_ratio") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_added$", "otelcol_otelsvc_k8s_pod_added_ratio") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_updated$", "otelcol_otelsvc_k8s_pod_updated_ratio") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_deleted$", "otelcol_otelsvc_k8s_pod_deleted_ratio") where resource.attributes["service.name"] == "opentelemetry-collector"
      - replace_pattern(metric.name, "^otelcol_processor_filter_spans\\.filtered$", "otelcol_processor_filter_spans.filtered_ratio") where resource.attributes["service.name"] == "opentelemetry-collector"
    - context: resource
      statements:
      - set(resource.attributes["k8s.pod.ip"], resource.attributes["net.host.name"]) where resource.attributes["service.name"] == "opentelemetry-collector"
      - delete_key(resource.attributes, "service_name") where resource.attributes["service.name"] == "opentelemetry-collector"
    - context: datapoint
      statements:
      - delete_key(datapoint.attributes, "service_name") where resource.attributes["service.name"] == "opentelemetry-collector"
      - delete_key(datapoint.attributes, "otel_scope_name") where datapoint.attributes["service.name"] == "opentelemetry-collector"
  transform/reduce:
    error_mode: silent
    log_statements:
    - context: log
      statements:
      - delete_key(resource.attributes, "azure.resourcegroup.name")
      - delete_key(resource.attributes, "azure.vm.name")
      - delete_key(resource.attributes, "azure.vm.scaleset.name")
      - delete_key(resource.attributes, "azure.vm.size")
      - delete_key(resource.attributes, "cloud.account.id")
      - delete_key(resource.attributes, "cloud.availability_zone")
      - delete_key(resource.attributes, "cloud.platform")
      - delete_key(resource.attributes, "cloud.provider")
      - delete_key(resource.attributes, "cloud.region")
      - delete_key(resource.attributes, "container.id")
      - delete_key(resource.attributes, "cx.otel_integration.name")
