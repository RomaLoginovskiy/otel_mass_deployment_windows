# Collector config for the Node-shape matrix (test/docker-win/Run-NodeShapesTest.ps1).
#
# Deliberately MINIMAL next to deploy/config.supervisor.yaml: this image only has to accept OTLP
# from instrumented Node apps and ship it, so there is no filelog, no hostmetrics, no spanmetrics
# and no `opamp` extension. Everything that IS here is copied from the reference config so the
# harness cannot pass against semantics the fleet does not use:
#
#   * application_name_attributes ordered list - the ONLY working app-name mechanism
#     (a bare cx.application.name resource attribute does nothing). host.name is the fallback,
#     so every shape's telemetry is attributable to this container.
#   * subsystem_name_attributes: service.name - each PM2 app's OTEL_SERVICE_NAME becomes the
#     Coralogix subsystem, which is what the final DataPrime sweep groups by.
#   * telemetry.metrics.readers/pull/prometheus on :8888 - the per-shape LOCAL gate
#     (otelcol_receiver_accepted_spans / otelcol_exporter_sent_spans rising, send_failed flat)
#     that makes a shape fail in seconds instead of after a 15-minute ingest wait.
#   * 127.0.0.1 endpoints, never localhost: on a dual-stack host localhost resolves to ::1
#     first and the export is dropped silently.
extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
        max_recv_msg_size_mib: 20
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    send_batch_max_size: 2048
    send_batch_size: 1024
    timeout: 1s
  # env brings in OTEL_RESOURCE_ATTRIBUTES (what Detect-Workloads.ps1 publishes, including
  # workload.pm2.hosting/owner/home); system supplies host.name for the app-name fallback.
  resourcedetection/env:
    detectors: [env, system]
    override: false
    system:
      hostname_sources: [os]
      resource_attributes:
        host.arch: {enabled: true}
        host.id: {enabled: true}
        host.name: {enabled: true}
        os.description: {enabled: true}
        os.type: {enabled: true}

exporters:
  coralogix:
    application_name: otel
    application_name_attributes:
    - cx.application.name
    - service.namespace
    - host.name
    domain: ${env:CORALOGIX_DOMAIN:-eu1.coralogix.com}
    private_key: ${env:CORALOGIX_PRIVATE_KEY}
    subsystem_name: nodeshapes
    subsystem_name_attributes:
    - service.name
    timeout: 30s

service:
  extensions: [health_check]
  telemetry:
    logs:
      encoding: json
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: 8888
              without_scope_info: false
              without_type_suffix: false
              without_units: false
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection/env, batch]
      exporters: [coralogix]
    logs:
      receivers: [otlp]
      processors: [resourcedetection/env, batch]
      exporters: [coralogix]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection/env, batch]
      exporters: [coralogix]
