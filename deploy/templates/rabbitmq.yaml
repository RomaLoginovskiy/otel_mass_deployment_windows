  transform/semconv:
    error_mode: ignore
    trace_statements:
    - context: span
      statements:
      - set(span.attributes["http.method"], span.attributes["http.request.method"]) where span.attributes["http.request.method"] != nil
  transform/spanmetrics:
    error_mode: silent
    metric_statements:
    - context: datapoint
      statements:
      - set(datapoint.attributes["status.code"], "STATUS_CODE_ERROR") where datapoint.attributes["status.code"] == nil and instrumentation_scope.name == "spanmetricsconnector" and datapoint.attributes["otel.status_code"] == "ERROR"
      - set(datapoint.attributes["status.code"], "STATUS_CODE_OK") where datapoint.attributes["status.code"] == nil and instrumentation_scope.name == "spanmetricsconnector" and datapoint.attributes["otel.status_code"] == "OK"
      - set(datapoint.attributes["status.code"], "STATUS_CODE_UNSET") where datapoint.attributes["status.code"] == nil and instrumentation_scope.name == "spanmetricsconnector" and (datapoint.attributes["otel.status_code"] == "UNSET" or datapoint.attributes["otel.status_code"] == nil)

receivers:
  filelog/iis:
    header:
      metadata_operators:
      - if: body matches "^#Fields:"
        parse_from: body
        regex: ^#Fields:\s+(?P<csv_header>.+)$
        type: regex_parser
      pattern: ^#.*$
    include:
    - C:\inetpub\logs\LogFiles\W3SVC*\*.log
    include_file_name: true
    include_file_path: false
    operators:
    - delimiter: ' '
      header_attribute: csv_header
      id: iis_csv_parser
      if: body != nil and body not matches "^#"
      trim_space: true
      type: csv_parser
    start_at: beginning
    storage: file_storage
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk: null
      filesystem:
        exclude_mount_points:
          match_type: strict
          mount_points:
          - ""
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network: null
      paging: null
      process:
        metrics:
          process.cpu.utilization:
            enabled: true
          process.memory.utilization:
            enabled: true
          process.threads:
            enabled: true
        mute_process_all_errors: true
  iis:
    collection_interval: 30s
  # ---- RabbitMQ metrics (Management plugin HTTP API) ----
  # node.* metrics are DISABLED by default in the receiver; enable the node-health set
  # explicitly. The queue/message-level default metrics (rabbitmq.consumer.count,
  # rabbitmq.message.*) stay on. guest/guest works over loopback for a co-located broker.
  rabbitmq:
    endpoint: ${env:RABBITMQ_ENDPOINT:-http://localhost:15672}
    username: ${env:RABBITMQ_USERNAME:-guest}
    password: ${env:RABBITMQ_PASSWORD:-guest}
    collection_interval: 15s
    metrics:
      rabbitmq.node.mem_used:
        enabled: true
      rabbitmq.node.mem_limit:
        enabled: true
      rabbitmq.node.disk_free:
        enabled: true
      rabbitmq.node.disk_free_limit:
        enabled: true
      rabbitmq.node.fd_used:
        enabled: true
      rabbitmq.node.fd_total:
        enabled: true
      rabbitmq.node.sockets_used:
        enabled: true
      rabbitmq.node.sockets_total:
        enabled: true
      rabbitmq.node.proc_used:
        enabled: true
      rabbitmq.node.proc_total:
        enabled: true
      rabbitmq.node.uptime:
        enabled: true
  # ---- RabbitMQ logs (no upstream receiver -> tail the log dir, like filelog/iis) ----
  # RabbitMQ writes plain-text lines (NOT CSV), so this uses no csv_parser. The `add`
  # operator tags only these records with messaging.system=rabbitmq (avoids stamping the
  # shared logs pipeline). Reuses the file_storage extension already enabled in the base.
  filelog/rabbitmq:
    include:
    - ${env:RABBITMQ_LOG_GLOB:-C:\rabbitmq\log\*.log}
    include_file_name: true
    include_file_path: false
    start_at: beginning
    storage: file_storage
    operators:
    - type: add
      field: attributes["messaging.system"]
      value: rabbitmq
    - type: regex_parser
      if: 'body matches "^[0-9]{4}-[0-9]{2}-[0-9]{2}"'
      parse_from: body
      regex: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+).*\[(?P<level>\w+)\]'
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_LISTEN_INTERFACE:-127.0.0.1}:4317
        max_recv_msg_size_mib: 20
      http:
        endpoint: ${env:OTEL_LISTEN_INTERFACE:-127.0.0.1}:4318
  prometheus:
    config:
      scrape_configs:
      - job_name: opentelemetry-collector
        scrape_interval: '30s'
        static_configs:
        - targets:
          - ${env:OTEL_LISTEN_INTERFACE:-127.0.0.1}:8888
  windowseventlog/application:
    channel: Application
  windowseventlog/security:
    channel: Security
  windowseventlog/system:
    channel: System

service:
  extensions:
  - health_check
  - file_storage
  - zpages
  - pprof
  pipelines:
    logs:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - resourcedetection/region
      - resourcedetection/env
      - resource/metadata
      - resource/service
      - resource/environment
      - transform/iis_service_labels
      - transform/reduce
      - transform/iis
      - batch
      receivers:
      - windowseventlog/system
      - windowseventlog/application
      - windowseventlog/security
      - filelog/iis
      - filelog/rabbitmq
      - otlp
    logs/resource_catalog:
      exporters:
      - coralogix/resource_catalog
      processors:
      - memory_limiter
      - resource/metadata
      - resource/service
      - resource/environment
      - transform/iis_service_labels
      - resourcedetection/entity
      - resourcedetection/region
      - transform/entity-event
      receivers:
      - hostmetrics
    metrics:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - resourcedetection/region
      - resourcedetection/env
      - resource/metadata
      - resource/service
      - resource/environment
      - transform/spanmetrics
      - transform/reduce
      - transform/prometheus
      - batch
      receivers:
      - hostmetrics
      - spanmetrics
      - spanmetrics/db
      - prometheus
      - iis
      - otlp
    # RabbitMQ metrics on their own pipeline (mirrors deploy-linux metrics/databases):
    # rabbitmq receiver -> shared resource/env processors + resource/rabbitmq stamp -> coralogix.
    metrics/rabbitmq:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - resource/metadata
      - resource/service
      - resource/environment
      - resource/rabbitmq
      - transform/reduce
      - batch
      receivers:
      - rabbitmq
    metrics/compact:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - transform/spanmetrics
      - batch
      receivers:
      - spanmetrics/compact
    metrics/db_compact:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - transform/spanmetrics
      - batch
      receivers:
      - spanmetrics/db_compact
    traces:
      exporters:
      - spanmetrics
      - forward/db
      - forward/compact
      - forward/db_compact
      - coralogix
      processors:
      - memory_limiter
      - resourcedetection/region
      - resourcedetection/env
      - resource/metadata
      - resource/service
      - resource/environment
      - transform/spanmetrics
      - redaction/spanname
      - transform/reduce
      - transform/semconv
      - transform/db_semconv
      - groupbytrace/transactions
      - coralogix
      - batch
      receivers:
      - otlp
    traces/compact:
      exporters:
      - spanmetrics/compact
      processors:
      - transform/compact
      - batch
      receivers:
      - forward/compact
    traces/db:
      exporters:
      - spanmetrics/db
      processors:
      - filter/db_spanmetrics
      - batch
      receivers:
      - forward/db
    traces/db_compact:
      exporters:
      - spanmetrics/db_compact
      processors:
      - filter/db_compact_spanmetrics
      - transform/db_compact
      - batch
      receivers:
      - forward/db_compact
  telemetry:
    logs:
      encoding: json
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: ${env:OTEL_LISTEN_INTERFACE:-127.0.0.1}
              port: 8888
              without_scope_info: false
              without_type_suffix: false
              without_units: false
